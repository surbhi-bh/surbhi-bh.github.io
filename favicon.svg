<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="clip">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
    <clipPath id="right">
      <rect x="16" y="0" width="16" height="32"/>
    </clipPath>
  </defs>
  <!-- White background -->
  <rect width="32" height="32" rx="6" fill="#ffffff"/>
  <!-- Red top-right -->
  <rect x="16" y="0" width="16" height="26" fill="#d94f3d" clip-path="url(#clip)"/>
  <!-- Blue bottom-left -->
  <rect x="0" y="26" width="16" height="6" fill="#4a7fa5" clip-path="url(#clip)"/>
  <!-- Yellow bottom-right -->
  <rect x="16" y="26" width="16" height="6" fill="#e8a820" clip-path="url(#clip)"/>
  <!-- Dark glyph on white side -->
  <text x="16" y="22" font-family="Georgia,serif" font-size="19" text-anchor="middle" fill="#1a1a1a" clip-path="url(#clip)">𓋴𓃀</text>
  <!-- White glyph on red side -->
  <text x="16" y="22" font-family="Georgia,serif" font-size="19" text-anchor="middle" fill="#ffffff" clip-path="url(#right)">𓋴𓃀</text>
</svg>
